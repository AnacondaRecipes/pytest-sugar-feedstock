{% set name = "pytest-sugar" %}
{% set version = "1.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 73b8b65163ebf10f9f671efab9eed3d56f20d2ca68bda83fa64740a92c08f65d

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: True  #[py<38]

requirements:
  host:
    - python
    - pip
    - setuptools >=40.6.0
    - poetry-core
    - wheel
  run:
    - python
    - packaging >=21.3
    # Package uses hook which is removed in pytest>=9
    # https://docs.pytest.org/en/latest/deprecations.html#py-path-local-arguments-for-hooks-replaced-with-pathlib-path
    # !! Important: Support for pytest>=9 will be added in next release !!
    # https://github.com/Teemu/pytest-sugar/pull/301
    - pytest >=6.2.0,<9
    - termcolor >=2.1.0

test:
  source_files:
    - pyproject.toml
    - test_sugar.py
  imports:
    - pytest_sugar
  commands:
    - pip check
    - pytest -v
  requires:
    - pip
    - pytest

about:
  home: https://github.com/Teemu/pytest-sugar
  dev_url: https://github.com/Teemu/pytest-sugar
  doc_url: https://github.com/Teemu/pytest-sugar/tree/main#readme
  summary: Pytest plugin that adds a progress bar and other visual enhancements
  description: |
    pytest-sugar is a plugin for pytest that changes the default look and feel of pytest
    (e.g. progressbar, show tests that fail instantly).
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
    - ocefpaf